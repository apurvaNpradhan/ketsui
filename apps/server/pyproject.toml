[project]
name = "app"
version = "0.1.0"
description = "Ketsui backend"
requires-python = ">=3.14,<4.0"
dependencies = [
  "fastapi>=0.141.1,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "alembic<2.0.0,>=1.12.1",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "sqlmodel>=0.0.39,<1.0.0",
  "pydantic-settings<3.0.0,>=2.2.1",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "scalar-fastapi>=1.9.0",
]

[dependency-groups]
dev = ["mypy<3.0.0,>=1.8.0", "ty>=0.0.25", "ruff<1.0.0,>=0.2.2", "httpx2>=2.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "W191", "B904"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
