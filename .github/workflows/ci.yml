name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"

      - name: Install dependencies
        run: |
          corepack enable && corepack prepare pnpm@12.2.0 --activate
          pnpm install --frozen-lockfile
          uv sync --all-packages

      - name: Check frontend
        run: pnpm check

      - name: Check backend
        run: |
          uv run ruff check apps/server/src apps/server/tests
          uv run ruff format --check apps/server/src apps/server/tests

      - name: Test backend
        run: uv run --directory apps/server pytest
