name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: changethis
      BACKEND_DB_PASSWORD: backendpassword
      AUTH_DB_PASSWORD: authpassword
      BETTER_AUTH_SECRET: ci-test-secret-replace-with-32-characters-minimum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.0
        with:
          version: "latest-known"
      - run: uv sync --all-packages
      - run: uv run ruff check apps/server/app apps/server/tests
      - run: uv run ruff format --check apps/server/app apps/server/tests
      - run: uv run python -m unittest discover -s apps/server/tests
      - name: Prepare Compose environment
        run: cp .env.docker.example .env.docker
      - run: docker compose --env-file .env.docker down -v --remove-orphans
      - run: docker compose --env-file .env.docker up --build -d --wait backend
      - name: Test backend health
        run: curl --fail http://localhost:8000/v1/utils/health-check/
      - run: docker compose --env-file .env.docker down -v --remove-orphans
