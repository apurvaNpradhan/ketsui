services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD must be set}
      BACKEND_MIGRATION_DB_PASSWORD: ${BACKEND_MIGRATION_DB_PASSWORD:?BACKEND_MIGRATION_DB_PASSWORD must be set}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      AUTH_MIGRATION_DB_PASSWORD: ${AUTH_MIGRATION_DB_PASSWORD:?AUTH_MIGRATION_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://backend_app:${BACKEND_DB_PASSWORD}@db:5432/backend_db
      DATABASE_MIGRATION_URL: postgresql://backend_migration_user:${BACKEND_MIGRATION_DB_PASSWORD}@db:5432/backend_db
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      # The issuer is public; the backend reads JWKS over the private Compose network.
      BETTER_AUTH_JWKS_URL: http://frontend:${FRONTEND_PORT:-5173}/api/auth/jwks
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set to the public auth URL}
      FASTAPI_ENV: ${FASTAPI_ENV:-production}
      PROJECT_NAME: ${PROJECT_NAME:-Ketsui}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://backend_app:${BACKEND_DB_PASSWORD}@db:5432/backend_db
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BETTER_AUTH_JWKS_URL: http://frontend:${FRONTEND_PORT:-5173}/api/auth/jwks
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set to the public auth URL}
      FASTAPI_ENV: ${FASTAPI_ENV:-production}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      AI_ENDPOINT: ${AI_ENDPOINT:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      PROJECT_NAME: ${PROJECT_NAME:-Ketsui}
    command: ["bash", "scripts/start.sh"]
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT:-8000}/v1/utils/health-check/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_MIGRATION_DATABASE_URL: postgresql://auth_migration_user:${AUTH_MIGRATION_DB_PASSWORD}@db:5432/auth_db
    command: ["pnpm", "--filter", "@repo/db", "db:migrate"]
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      AUTH_DATABASE_URL: postgresql://auth_app:${AUTH_DB_PASSWORD}@db:5432/auth_db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set to the public auth URL}
      FASTAPI_ORIGIN: http://backend:${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    command:
      ["sh", "-c", 'NITRO_PORT="${FRONTEND_PORT:-5173}" node apps/web/.output/server/index.mjs']
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${FRONTEND_PORT:-5173}').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
