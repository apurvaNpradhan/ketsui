services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: postgres
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Variable not set}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Variable not set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Ketsui}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      DATABASE_URL: postgresql://backend_app:${BACKEND_DB_PASSWORD:?Variable not set}@db:5432/backend_db
      BETTER_AUTH_JWKS_URL: http://frontend:3000/api/auth/jwks
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
    command:
      ["sh", "-c", "bash scripts/prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/utils/health-check/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://auth_app:${AUTH_DB_PASSWORD:?Variable not set}@db:5432/auth_db
      FASTAPI_ORIGIN: http://backend:8000
      VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:5173}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Variable not set}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    command:
      [
        "sh",
        "-c",
        "cd packages/db && node ../../node_modules/.pnpm/drizzle-kit@*/node_modules/drizzle-kit/bin.cjs migrate && node ../../apps/web/.output/server/index.mjs",
      ]
    restart: on-failure
    ports:
      - "5173:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
