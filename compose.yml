services:
  db:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: ["sh", "-c", "bash scripts/prestart.sh && bash scripts/start.sh"]
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT}/v1/utils/health-check/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FASTAPI_ORIGIN: "http://backend:${BACKEND_PORT}"
    command:
      [
        "sh",
        "-c",
        'cd packages/db && node ../../node_modules/.pnpm/drizzle-kit@*/node_modules/drizzle-kit/bin.cjs migrate && NITRO_PORT="${FRONTEND_PORT}" node ../../apps/web/.output/server/index.mjs',
      ]
    restart: on-failure
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${FRONTEND_PORT}').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
